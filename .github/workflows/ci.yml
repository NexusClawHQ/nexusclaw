name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: build · test · audit (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22']
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
      SIDECAR_PGHOST: localhost
      SIDECAR_PGPORT: '5432'
      SIDECAR_PGUSER: postgres
      SIDECAR_PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Root workspace — install & build
        run: |
          npm ci
          npm run build

      - name: Root workspace — unit tests (backend + dashboard)
        run: |
          npm test -w @nexusclaw/backend
          npm test -w @nexusclaw/dashboard

      - name: Root workspace — locale parity check (en-US ↔ zh-CN)
        run: npm run check:i18n

      - name: Dify adapter — schema sanity check
        run: npm run check:dify

      - name: Root workspace — audit gate (fail on high/critical)
        run: npm audit --audit-level=high

      - name: Governance workspace — pnpm verify (build + tests + sidecar e2e)
        working-directory: governance
        run: |
          corepack enable
          corepack pnpm install --frozen-lockfile
          corepack pnpm verify

  docker:
    name: docker image build (quick-start path)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Validate compose file
        run: docker compose config --quiet
        env:
          DATABASE_PASSWORD: ci-placeholder
          JWT_SECRET: ci-placeholder-at-least-32-characters
          COMMUNITY_SOURCE_URL: https://example.com/source

      - name: Build backend image
        run: docker build -t nexusclaw-community:ci .

  adapters:
    name: adapters (n8n typecheck · python unittest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: governance/adapters/n8n/package-lock.json

      - name: n8n adapter — typecheck (published package source)
        working-directory: governance/adapters/n8n
        run: |
          npm ci
          npm run typecheck

      - name: Python adapter — offline unit tests
        run: python3 -m unittest discover -s governance/adapters/python/test -v
